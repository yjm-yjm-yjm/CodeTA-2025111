syntax = "proto3";

package templateorder.v1;

option go_package = "template-mall/TemplateOrderServer/api/gen/templateorder/v1;templateorderv1";

// 作业固定入口文件。消息定义拆到同目录其他 .proto，保证生成代码单文件 ≤1000 行。
import "user.proto";
import "catalog.proto";
import "trade.proto";

// TemplateOrderService 是模板商城核心业务 gRPC 服务。
service TemplateOrderService {
  rpc UpsertUser(UpsertUserRequest) returns (UpsertUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc SetMembership(SetMembershipRequest) returns (SetMembershipResponse);
  rpc SubscribeMembership(SubscribeMembershipRequest) returns (SubscribeMembershipResponse);

  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc SetTemplateShelf(SetTemplateShelfRequest) returns (SetTemplateShelfResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);

  rpc DownloadTemplate(DownloadTemplateRequest) returns (DownloadTemplateResponse);

  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

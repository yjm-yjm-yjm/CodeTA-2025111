syntax = "proto3";

package templateorder.v1;

option go_package = "template-mall/TemplateAdminWebServer/api/gen/templateorder/v1;templateorderv1";

import "enums.proto";

message Template {
  string template_id = 1;
  string name = 2;
  string file_type = 3;
  int64 price_fen = 4;
  PriceType price_type = 5;
  TemplateStatus status = 6;
  string storage_provider = 7;
  string bucket = 8;
  string object_key = 9;
  string original_filename = 10;
  int64 file_size = 11;
  int64 created_at_unix = 12;
  int64 updated_at_unix = 13;
  // 封面对象键（首屏预览图）；cover_url 为签名后的临时访问地址（仅出参）
  string cover_object_key = 14;
  string cover_url = 15;
}

message Order {
  string order_id = 1;
  string user_id = 2;
  string template_id = 3;
  OrderType order_type = 4;
  OrderStatus status = 5;
  int64 price_fen_snapshot = 6;
  string pay_order_id = 7;
  string pay_url = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message PaymentInfo {
  string pay_order_id = 1;
  string order_id = 2;
  int64 amount_fen = 3;
  string pay_url = 4;
  string status = 5;
}

message User {
  string user_id = 1;
  string nickname = 2;
  bool is_member = 3;
  int64 created_at_unix = 4;
  int64 updated_at_unix = 5;
}

syntax = "proto3";

package templateorder.v1;

option go_package = "template-mall/TemplateAdminWebServer/api/gen/templateorder/v1;templateorderv1";

import "enums.proto";
import "models.proto";
import "paging.proto";

message DownloadTemplateRequest {
  string user_id = 1;
  string template_id = 2;
}

message DownloadGranted {
  string order_id = 1;
  string download_url = 2;
  int64 expire_at_unix = 3;
  Order order = 4;
}

message PaymentRequired {
  Order order = 1;
  PaymentInfo payment = 2;
}

message DownloadTemplateResponse {
  oneof result {
    DownloadGranted granted = 1;
    PaymentRequired payment_required = 2;
  }
}

message ListOrdersRequest {
  string user_id = 1;
  PageRequest page = 2;
  OrderType order_type = 3;
  OrderStatus status = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  PageInfo page = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string user_id = 1;
  string order_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

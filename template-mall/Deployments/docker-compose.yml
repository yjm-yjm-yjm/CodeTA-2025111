services:
  mysql:
    image: mysql:8.0
    container_name: template-mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: template_order_db
    ports:
      # Host 3306 often occupied; container still listens on 3306.
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 40

  kafka:
    image: apache/kafka:3.8.1
    container_name: template-mall-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 40

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: template-mall-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  template-order-server:
    build:
      context: ../TemplateOrderServer
    container_name: template-order-server
    restart: unless-stopped
    env_file:
      - ../TemplateOrderServer/.env
    environment:
      GRPC_ADDR: ":50051"
      MYSQL_DSN: root:root@tcp(mysql:3306)/template_order_db?charset=utf8mb4&parseTime=True&loc=Local
      KAFKA_BROKERS: kafka:29092
      PAY_BASE_URL: http://pay-web-server:8082
    ports:
      - "50051:50051"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      pay-web-server:
        condition: service_started

  pay-web-server:
    build:
      context: ../PayWebServer
    container_name: pay-web-server
    restart: unless-stopped
    env_file:
      - ../PayWebServer/.env
    environment:
      HTTP_ADDR: ":8082"
      PUBLIC_BASE_URL: http://127.0.0.1:8082
      MYSQL_DSN: root:root@tcp(mysql:3306)/template_order_db?charset=utf8mb4&parseTime=True&loc=Local
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: template-pay-events
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

  template-web-server:
    build:
      context: ../TemplateWebServer
    container_name: template-web-server
    restart: unless-stopped
    env_file:
      - ../TemplateWebServer/.env
    environment:
      HTTP_ADDR: ":8080"
      ORDER_GRPC_ADDR: template-order-server:50051
      AUTH_USERS_FILE: /data/users.json
    ports:
      - "8080:8080"
    volumes:
      - web_users_data:/data
    depends_on:
      - template-order-server

  template-admin-web-server:
    build:
      context: ../TemplateAdminWebServer
    container_name: template-admin-web-server
    restart: unless-stopped
    env_file:
      - ../TemplateAdminWebServer/.env
    environment:
      HTTP_ADDR: ":8081"
      PUBLIC_BASE_URL: http://127.0.0.1:8081
      ORDER_GRPC_ADDR: template-order-server:50051
      ADMIN_FRONTEND_URL: http://127.0.0.1:3001
    ports:
      - "8081:8081"
    depends_on:
      - template-order-server

volumes:
  mysql_data:
  web_users_data:
